[package]
name = "studio"
version = "0.1.0"
description = "Studio — one application for the whole pre-production pipeline"
authors = ["Sam Wasserman <sam@wassermanproductions.com>"]
license = "Apache-2.0"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = "2"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
